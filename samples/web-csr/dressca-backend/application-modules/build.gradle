plugins {
	id 'java'
	id 'org.springframework.boot' version "${springBootVersion}"
	id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
	id 'runMyBatisGenerator'
	id 'updateMyBatisGeneratorMapperForOptimisticLocking'
}

group = 'com.dressca'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

sourceSets {
    main {
      // mybatis SQL map XML ファイルを java 以下でも検知する
      resources {
        srcDir 'src/main/java'
        exclude '**/*.java'
      }
    }
}

repositories {
	mavenCentral()
}

configurations {
  // MyBatis Generator の自動生成で利用するライブラリのための依存関係の構成を定義
  mybatisTasks
  // 使用しないロギングライブラリを除外
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

dependencies {
	implementation platform(supportDependencies.spring_modulith_bom)

	implementation supportDependencies.spring_boot_starter_log4j2
	implementation supportDependencies.spring_boot_transaction
	implementation supportDependencies.commons_lang3
	implementation supportDependencies.java_uuid_generator
	implementation supportDependencies.mybatis_spring_boot_starter

  implementation project(':system-common')

	testImplementation supportDependencies.spring_boot_starter_test
	testImplementation supportDependencies.mybatis_spring_boot_starter_test
	testImplementation supportDependencies.spring_modulith_starter_test

  compileOnly supportDependencies.spring_modulith_starter_core

  mybatisTasks supportDependencies.mybatis_generator_core
  mybatisTasks supportDependencies.h2database
  mybatisTasks supportDependencies.java_parser_core
}

bootJar{
  enabled = false
}

jar{
  enabled = true
}

runMyBatisGeneratorConfig {
  javaTargetProjectDirectory = file('src/main/java')
  resourcesTargetProjectDirectory = file('src/main/resources')
  schemaFile = file('src/main/resources/schema.sql')
  configFile = file('src/main/resources/mybatisGeneratorConfig.xml')
  generatorClasspath.from(configurations.mybatisTasks)
}

updateMyBatisGeneratorMapperForOptimisticLockingConfig {
  generatedDirectory = file('src/main/resources/com/dressca/applicationmodules/catalogmanagement/internal/infrastructure/repository/mybatis/generated/mapper/')
  xmlFilePaths = ['CatalogItemMapper.xml']
  optimisticLockColumn = 'row_version'
  optimisticLockJdbcType = 'TIMESTAMP_WITH_TIMEZONE'
}

tasks.named('runMyBatisGenerator') {
  finalizedBy 'updateMyBatisGeneratorMapperForOptimisticLocking'
}
