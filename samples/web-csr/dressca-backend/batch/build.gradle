plugins {
	id 'java'
	id 'org.springframework.boot' version "${springBootVersion}"
	id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
}

group = 'com.dressca'
version = '0.0.1-SNAPSHOT'

repositories {
	mavenCentral()
}

dependencies {
	implementation supportDependencies.spring_boot_starter_batch_jdbc
	implementation supportDependencies.commons_lang3
	implementation supportDependencies.spring_boot_starter_log4j2

	runtimeOnly supportDependencies.h2database
	runtimeOnly supportDependencies.postgresql

	implementation project(':application-modules')
	implementation project(':system-common')

	testImplementation supportDependencies.spring_boot_starter_batch_jdbc_test
	testImplementation supportDependencies.h2database
	testImplementation supportDependencies.archunit_junit6
}

// 機能テスト用のテストスイート（src/featureTest）
// https://docs.gradle.org/current/userguide/jvm_test_suite_plugin.html
testing {
	suites {
		featureTest(JvmTestSuite) {
			// JUnit のバージョンは Spring Boot の BOM に合わせる
			useJUnitJupiter(dependencyManagement.importedProperties['junit-jupiter.version'])
			dependencies {
				implementation project()
				implementation supportDependencies.spring_boot_starter_batch_jdbc_test
				implementation supportDependencies.h2database
			}
			targets.configureEach {
				testTask.configure {
					// 単体テストと同じく test プロファイルで実行
					jvmArgs '-Dspring.profiles.active=test'
					shouldRunAfter(tasks.named('test'))
				}
			}
		}
	}
}

// check（build）タスクで機能テストも実行
tasks.named('check') {
	dependsOn testing.suites.featureTest
}

configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

tasks.register('bootRunDev', org.springframework.boot.gradle.tasks.run.BootRun){
	group = 'application'
	description = 'Runs this project as a Spring Boot Application using local profile.'
	args = ["--spring.profiles.active=local"]
	mainClass = 'com.dressca.batch.BatchApplication'
	classpath = sourceSets.main.runtimeClasspath
}
