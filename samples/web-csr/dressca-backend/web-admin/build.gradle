plugins {
	id 'java'
	id 'org.springframework.boot' version "${springBootVersion}"
	id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
	id 'org.springdoc.openapi-gradle-plugin' version "${springdocOpenapiGradlePluginVersion}"
}

group = 'com.dressca'
version = '0.0.1-SNAPSHOT'

repositories {
	mavenCentral()
}

dependencies {
	implementation supportDependencies.spring_boot_starter_webmvc
	implementation supportDependencies.spring_boot_starter_security
	implementation supportDependencies.spring_boot_starter_validation
	implementation supportDependencies.spring_boot_starter_actuator
	implementation supportDependencies.spring_boot_starter_log4j2
	implementation supportDependencies.springdoc_openapi_starter_webmvc_ui
	implementation supportDependencies.commons_lang3
	implementation supportDependencies.h2database

	implementation project(':application-modules')
	implementation project(':system-common')
	implementation project(':web')

	runtimeOnly supportDependencies.postgresql

	testImplementation supportDependencies.spring_boot_starter_webmvc_test
	testImplementation supportDependencies.spring_boot_starter_security_test
	testImplementation supportDependencies.archunit_junit6
}

// 結合テスト用のテストスイート（ソースセット: src/integrationTest）
// https://docs.gradle.org/current/userguide/jvm_test_suite_plugin.html
testing {
	suites {
		integrationTest(JvmTestSuite) {
			// JUnit のバージョンは Spring Boot の BOM に合わせる
			useJUnitJupiter(dependencyManagement.importedProperties['junit-jupiter.version'])

			dependencies {
				implementation project()
				implementation supportDependencies.spring_boot_starter_webmvc_test
				implementation supportDependencies.spring_boot_starter_security_test
			}

			targets {
				all {
					testTask.configure {
						// 結合テスト時は test プロファイルを利用
						jvmArgs '-Dspring.profiles.active=test'
						shouldRunAfter(test)
					}
				}
			}
		}
	}
}

tasks.named('compileIntegrationTestJava') {
	options.encoding = 'UTF-8'
}

// check （ build ）タスクで結合テストも実行する
tasks.named('check') {
	dependsOn(testing.suites.integrationTest)
}

configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}
afterEvaluate {
    tasks.named("forkedSpringBootRun") {
		workingDir("$rootDir/api-docs/web-admin")
	}
}
openApi {
    apiDocsUrl.set("http://localhost:8081/api-docs")
    outputDir.set(file("$rootDir/api-docs/web-admin"))
    outputFileName.set("api-specification.json")
}
tasks.register('bootRunDev', org.springframework.boot.gradle.tasks.run.BootRun){
	group = 'application'
	description = 'Runs this project as a Spring Boot Application using local profile.'
	args = ["--spring.profiles.active=local"]
	mainClass = 'com.dressca.web.admin.WebApplication'
	classpath = sourceSets.main.runtimeClasspath
}

build.dependsOn("generateOpenApiDocs")
