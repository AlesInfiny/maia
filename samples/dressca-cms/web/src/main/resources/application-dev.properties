# h2 database
spring.datasource.hikari.driver-class-name=org.h2.Driver

# DBをサーバーモードで立ち上げる場合の接続先情報
spring.datasource.hikari.jdbc-url=jdbc:h2:tcp://localhost:9092/mem:./data;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;
spring.sql.init.mode=always

# DBを組み込みモードで立ち上げる場合の接続先情報
# spring.datasource.hikari.jdbc-url=jdbc:h2:mem:./data;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;
# spring.sql.init.mode=embedded

spring.sql.init.schema-locations=classpath*:schema-*.sql
spring.sql.init.data-locations=classpath*:data-*.sql

spring.datasource.hikari.username=
spring.datasource.hikari.password=

# ヘルスチェックの API のログを検出するため logging level を変更する
logging.level.web=DEBUG

# Microsoft Entra External ID (CIAM)
spring.security.oauth2.client.registration.entra.provider=entra
spring.security.oauth2.client.registration.entra.client-id=${ENTRA_CLIENT_ID}
spring.security.oauth2.client.registration.entra.client-secret=${ENTRA_CLIENT_SECRET}
spring.security.oauth2.client.registration.entra.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.entra.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.entra.scope=openid,profile,email
spring.security.oauth2.client.provider.entra.issuer-uri=${ENTRA_ISSUER_URI}
