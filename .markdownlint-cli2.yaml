customRules:
  - custom-lint-rules/requires-title-and-description.js

gitignore: true

# 全ての md ファイルを対象に markdownlint-cli2 を実行する
globs:
  - "**/*.md"

# markdownlint の除外対象を以下に記載する
ignores:
  - "third-party-licenses/**"
  - "LICENSE"
  - "LICENSE-CODE"

# markdownlint のルール設定を以下に記載する
config:
  default: true
  line-length: false

  ol-prefix:
    style: "one"
  ul-style:
    style: "dash"

  ol-indent:
    indent: 4
  ul-indent:
    indent: 4

  table:
    style: "aligned"

  MD025:
    front_matter_title: ""

  MD046: false
  # Zensical のビルド対象外の Markdown は、 MD051 でページ内アンカーを検証する。
  MD051: true

# 特定のファイルに適用するルール設定を以下に記載する
overrides:
  # Zensical のビルド対象は、ページ内アンカーを Zensical のビルド（validation.invalid_link_anchors）で検証するため、 MD051 を無効にする。
  # また、見出しに付与した ID に「.」を含む場合（{#cc-by-4.0} など）、 MD051 が ID を認識できず誤検知する。
  - filter:
      - "documents/contents/**/*.md"
    combine: merge
    config:
      MD051: false
