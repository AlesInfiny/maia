      msal-packages:
        patterns:
          - "@azure/msal-*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      prod-dependencies:
        dependency-type: "production"
        patterns:
