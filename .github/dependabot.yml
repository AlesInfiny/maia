        update-types:
          - "minor"
          - "patch"
      # Dependabot の更新 PR が gradle.lockfile を更新しないため、ほかの依存の更新を巻き込まないよう分ける
      quality-tools:
        patterns:
          - "com.puppycrawl.tools:*"
          - "org.jacoco:*"
        update-types:
          - "minor"
          - "patch"
      other-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
