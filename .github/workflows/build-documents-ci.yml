---
# cspell:ignore endgroup fjogeleit markdownlint softprops tcort textlintignore textlintrc webapps yamlignore
name: ドキュメントのビルド (CI用)

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop, 'release/*']
    paths:
      - "documents/**"
      - "iis-files/**"
      - "samples/**"
      - "README.md"
      - ".github/CONTRIBUTING.md"
      - ".github/markdown-link-check.json"
      - ".github/workflows/build-documents-ci.yml"
      - ".github/workflows/build-and-release-documents.yml"
      - ".github/workflows/lint-documents/action.yml"
      - ".github/workflows/compress-sample-source/action.yml"
      - ".github/workflows/build-documents/action.yml"
      - ".github/workflows/pack-and-upload/action.yml"
      - ".markdownlint-cli2.yaml"
      - ".markdownlint.yaml"
      - ".textlintignore"
      - ".textlintrc"
      - ".yaml-lint.yml"
      - ".yamlignore"
      - "package-lock.json"
      - "package.json"
      - "requirements.txt"
  workflow_dispatch:

env:
  DOCUMENT_BASE_PATH: documents
  DOCUMENT_OUTPUT_FOLDER_NAME: build-artifacts
  DOCUMENT_ARTIFACTS_FILENAME: docs.zip
  COMPRESSED_SOURCE_PATH: contents/samples/downloads

jobs:
  build:
    name: ドキュメントのビルド
    runs-on: ubuntu-latest
    steps:
      - name: ブランチのチェックアウト
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - id: lint-documents
        name: ドキュメントの Lint
        continue-on-error: true
        uses: ./.github/workflows/lint-documents

      # main ブランチ向けの PR（リリース PR）と手動実行時は全ファイル、それ以外の PR では変更ファイルのみをチェックする。
      - id: check-links
        name: ドキュメントのリンクチェック
        continue-on-error: true
        uses: tcort/github-action-markdown-link-check@e7c7a18363c842693fadde5d41a3bd3573a7a225  # v1.1.2
        with:
          config-file: .github/markdown-link-check.json
          use-quiet-mode: "yes"
          folder-path: "."
          check-modified-files-only: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && 'yes' || 'no' }}
          base-branch: ${{ github.base_ref }}

      - name: リンクチェック結果の表示
        shell: bash
        run: |
          echo '# Link Check Result :link:' >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-links.outcome }}" == "failure" ]; then
            echo ':x: リンク切れを検出しました。  ' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            printenv MLC_OUTPUT >> $GITHUB_STEP_SUMMARY || echo '詳細は「ドキュメントのリンクチェック」ステップのログを確認してください。' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo ':heavy_check_mark: リンクチェックに成功しました。' >> $GITHUB_STEP_SUMMARY
          fi

      - name: サンプルアプリケーションのソースコード圧縮
        uses: ./.github/workflows/compress-sample-source
        with:
          compressed-source-path: ${{ env.DOCUMENT_BASE_PATH }}/${{ env.COMPRESSED_SOURCE_PATH }}

      - name: ドキュメントのビルド
        uses: ./.github/workflows/build-documents
        with:
          document-base-path: ${{ env.DOCUMENT_BASE_PATH }}
          output-folder-name: ${{ env.DOCUMENT_OUTPUT_FOLDER_NAME }}

      - name: Lint結果の成否判定
        if: steps.lint-documents.outcome == 'failure' || steps.check-links.outcome == 'failure'
        run: |
          exit 1;

      - name: ビルドアーティファクトのパッケージングとアップロード
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/workflows/pack-and-upload
        with:
          packaging-folder-path: ${{ env.DOCUMENT_BASE_PATH }}/${{ env.DOCUMENT_OUTPUT_FOLDER_NAME }}
          document-artifact-path: ${{ env.DOCUMENT_BASE_PATH }}/${{ env.DOCUMENT_ARTIFACTS_FILENAME }}
