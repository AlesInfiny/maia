---

name: git-flow に従った PR のブランチ組み合わせの検証

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop, 'release/*']

jobs:
  check:
    name: PR のブランチ組み合わせの検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: PRのブランチ組み合わせを検証
        uses: ./.github/workflows/validate-pr-branch-combination
