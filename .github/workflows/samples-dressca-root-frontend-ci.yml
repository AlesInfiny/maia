---

name: dressca-root-frontend CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop, 'release/*']
    paths:
      - 'samples/web-csr/dressca-frontend/*.*'
      - '.github/workflows/samples-dressca-root-frontend-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: samples/web-csr/dressca-frontend/

jobs:
  check:
    name: Dressca モノレポのルートプロジェクトのチェック
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"  # 文字化け防止のためカラーコードを出力しない
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Use Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: lts/*
          # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
          cache: npm

      - name: node パッケージのインストール
        run: npm ci --ignore-scripts

      # 前のチェックが失敗しても後のチェックの結果を確認できるよう、各チェックは失敗しても続行し、最後に成否を判定する。
      - id: run-format
        name: format の実行
        continue-on-error: true
        run: npm run format:ci:root >> /var/tmp/format-result.txt 2>&1

      - name: format の結果出力
        uses: ./.github/workflows/file-to-summary
        with:
          body: /var/tmp/format-result.txt
          header: 'format の結果 :pen:'

      - id: run-type-check
        name: TypeScript の型チェック
        continue-on-error: true
        run: npm run type-check:root >> /var/tmp/type-check-result.txt 2>&1

      - name: TypeScript の型チェックの結果出力
        uses: ./.github/workflows/file-to-summary
        with:
          body: /var/tmp/type-check-result.txt
          header: '型チェックの結果 :pencil2:'

      - id: run-test
        name: ESLint のプロジェクトルールのテストの実行
        continue-on-error: true
        run: npm run test:root >> /var/tmp/test-result.txt 2>&1

      - name: ESLint のプロジェクトルールのテストの結果出力
        uses: ./.github/workflows/file-to-summary
        with:
          body: /var/tmp/test-result.txt
          header: 'ESLint のプロジェクトルールのテストの結果 :test_tube:'

      - name: チェックの成否判定
        if: steps.run-format.outcome == 'failure' || steps.run-type-check.outcome == 'failure' || steps.run-test.outcome == 'failure'
        run: |
          exit 1;
